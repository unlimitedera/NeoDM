<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="popup_title"></title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><h1 data-i18n="popup_title"></h1><button id="test" type="button" data-i18n="popup_test"></button></header>
<section id="mediaPanel">
<h2 data-i18n="popup_media_heading"></h2>
<p id="videoSummary" class="hint" role="status" aria-live="polite" hidden></p>
<ul id="mediaList"></ul>
<div id="whyNone" class="hint" hidden><strong data-i18n="popup_why_no_button"></strong><ul id="whyList"></ul></div>
<p id="mediaNone" class="hint" data-i18n="popup_media_none"></p>
</section>
<section id="pausePanel">
<p id="pauseState" class="hint" role="status" aria-live="polite"></p>
<label><input type="checkbox" id="pauseSite"> <span id="pauseSiteLabel" data-i18n="popup_pause_site_default"></span></label>
<label><input type="checkbox" id="pauseAll"> <span data-i18n="popup_pause_all"></span></label>
<button id="resume" type="button" hidden data-i18n="popup_resume"></button>
<button id="captureAgain" type="button" hidden data-i18n="popup_capture_again"></button>
<p class="hint" data-i18n="popup_pause_hint"></p>
</section>
<section>
<label><input type="checkbox" id="ribbon"> <span data-i18n="popup_ribbon"></span></label>
<p class="hint" data-i18n="popup_ribbon_hint"></p>
<label><input type="checkbox" id="videoButton"> <span data-i18n="popup_video_button"></span></label>
<label><span data-i18n="popup_corner"></span> <select id="corner"><option value="left" data-i18n="popup_corner_left"></option><option value="right" data-i18n="popup_corner_right"></option></select></label>
</section>
<details open><summary data-i18n="popup_capture_heading"></summary>
<label><input type="checkbox" id="capture"> <span data-i18n="popup_capture"></span></label>
<label><input type="checkbox" id="sessionCookies"> <span data-i18n="popup_session_cookies"></span></label>
<p class="hint" data-i18n="popup_session_cookies_hint"></p>
<label><input type="checkbox" id="cookies"> <span data-i18n="popup_cookies"></span></label>
<p class="hint" data-i18n="popup_capture_hint"></p>
</details>
<details open><summary data-i18n="popup_types_heading"></summary>
<div id="types">
<label><input type="checkbox" data-type="video"> <span data-i18n="popup_type_video"></span></label>
<label><input type="checkbox" data-type="audio"> <span data-i18n="popup_type_audio"></span></label>
<label><input type="checkbox" data-type="image"> <span data-i18n="popup_type_image"></span></label>
<label><input type="checkbox" data-type="gif"> <span data-i18n="popup_type_gif"></span></label>
<label><input type="checkbox" data-type="archive"> <span data-i18n="popup_type_archive"></span></label>
<label><input type="checkbox" data-type="program"> <span data-i18n="popup_type_program"></span></label>
<label><input type="checkbox" data-type="document"> <span data-i18n="popup_type_document"></span></label>
<label><input type="checkbox" data-type="other"> <span data-i18n="popup_type_other"></span></label>
</div>
<p class="hint" data-i18n="popup_types_hint"></p>
</details>
<details id="recentPanel"><summary data-i18n="popup_recent_heading"></summary>
<ul id="recent"></ul>
<p id="recentNone" class="hint" data-i18n="popup_recent_none"></p>
<button id="recentClear" type="button" data-i18n="popup_recent_clear"></button>
<p class="hint" data-i18n="popup_recent_hint"></p>
</details>
<details id="sitesPanel"><summary data-i18n="popup_sites_heading"></summary>
<ul id="sites"></ul>
<p id="sitesNone" class="hint" data-i18n="popup_sites_none"></p>
<p class="hint" data-i18n="popup_sites_hint"></p>
</details>
<details id="hiddenPanel"><summary data-i18n="popup_hidden_heading"></summary>
<ul id="hiddenSites"></ul>
<p id="hiddenNone" class="hint" data-i18n="popup_hidden_none"></p>
<p class="hint" data-i18n="popup_hidden_hint"></p>
</details>
<p id="versionNote" class="hint" role="status" aria-live="polite" hidden></p>
<p id="status" role="status" aria-live="polite"></p>
<p id="footerVersion" class="hint"></p>
<script src="i18n.js"></script>
<script src="sniff.js"></script>
<script src="popup.js"></script>
</body></html>
